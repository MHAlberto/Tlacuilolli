name: Compile and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  typst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - name: Compile examples and run assertions
        shell: pwsh
        run: ./tests/run.ps1
